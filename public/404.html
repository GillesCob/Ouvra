<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#161c18" />
  <title>Page introuvable · Ouvra</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <style>
    :root { --bg: #161c18; --text: #e4e1da; --muted: #9aa59d; --accent: #5c7a5f; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
    main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px 16px; text-align: center; }
    img { width: 340px; max-width: 80%; height: auto; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 22px; font-weight: 700; }
    p { margin: 0; color: var(--muted); }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 12px; padding: 0 22px; background: var(--accent); color: #fff; border-radius: 8px; font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/images/ouvra-logo.svg" alt="Ouvra" width="341" height="252" />
    <h1>Oups, un souci</h1>
    <p>Cette page est introuvable.</p>
    <a href="/#viewer">Retour au Viewer</a>
  </main>
</body>
</html>
